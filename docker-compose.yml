version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17  # Updated to include pgvector
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb

    ports:
      - "5432:5432"

    volumes:
      - postgres_new_data:/var/lib/postgresql/data

volumes:
  postgres_new_data: